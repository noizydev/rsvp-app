<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="avatar-title">
  <title id="avatar-title">Avatar GF</title>
  <defs>
    <linearGradient id="av-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset=".55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="av-glow" cx=".3" cy=".25" r=".7">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="av-clip"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <g clip-path="url(#av-clip)">
    <rect width="200" height="200" fill="url(#av-bg)"/>
    <rect width="200" height="200" fill="url(#av-glow)"/>
    <!-- grid tipis -->
    <g stroke="#ffffff" stroke-opacity=".08" stroke-width="1">
      <path d="M0 40H200M0 80H200M0 120H200M0 160H200M40 0V200M80 0V200M120 0V200M160 0V200"/>
    </g>
    <!-- batang data di bawah -->
    <g fill="#ffffff" fill-opacity=".14">
      <rect x="28" y="150" width="16" height="50" rx="4"/>
      <rect x="52" y="138" width="16" height="62" rx="4"/>
      <rect x="76" y="156" width="16" height="44" rx="4"/>
      <rect x="100" y="128" width="16" height="72" rx="4"/>
      <rect x="124" y="142" width="16" height="58" rx="4"/>
      <rect x="148" y="120" width="16" height="80" rx="4"/>
    </g>
    <!-- garis tren -->
    <polyline points="22,146 50,132 78,140 104,114 130,124 156,96 182,74" fill="none" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#5eead4">
      <circle cx="104" cy="114" r="4"/>
      <circle cx="156" cy="96" r="4"/>
      <circle cx="182" cy="74" r="5"/>
    </g>
    <text x="100" y="104" text-anchor="middle" font-family="Poppins, 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="2">GF</text>
  </g>
</svg>
