<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="p5-title">
  <title id="p5-title">Infografis Kebiasaan Belajar Mahasiswa</title>
  <defs>
    <linearGradient id="p5-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset=".55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="p5-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#p5-bg)"/>
  <circle cx="740" cy="60" r="170" fill="#c084fc" opacity=".2"/>
  <circle cx="40" cy="470" r="160" fill="#2dd4bf" opacity=".16"/>

  <g font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif">
    <text x="48" y="74" fill="#ffffff" font-size="26" font-weight="700">Kebiasaan Belajar</text>
    <text x="48" y="100" fill="#c4b5fd" font-size="15">Survei 230 mahasiswa</text>

    <!-- donat -->
    <rect x="40" y="128" width="320" height="330" rx="22" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
    <g transform="rotate(-90 200 280)" fill="none" stroke-width="34">
      <circle cx="200" cy="280" r="96" stroke="#ffffff" stroke-opacity=".12"/>
      <!-- keliling ≈ 603 -->
      <circle cx="200" cy="280" r="96" stroke="#a78bfa" stroke-dasharray="271 603"/>
      <circle cx="200" cy="280" r="96" stroke="#2dd4bf" stroke-dasharray="181 603" stroke-dashoffset="-275"/>
      <circle cx="200" cy="280" r="96" stroke="#f0abfc" stroke-dasharray="139 603" stroke-dashoffset="-460"/>
    </g>
    <text x="200" y="276" fill="#ffffff" font-size="34" font-weight="700" text-anchor="middle">45%</text>
    <text x="200" y="300" fill="#e9d5ff" font-size="14" text-anchor="middle">belajar malam</text>
    <g font-size="12" fill="#e0e7ff">
      <circle cx="70" cy="428" r="6" fill="#a78bfa"/><text x="82" y="432">Malam</text>
      <circle cx="160" cy="428" r="6" fill="#2dd4bf"/><text x="172" y="432">Siang</text>
      <circle cx="244" cy="428" r="6" fill="#f0abfc"/><text x="256" y="432">Pagi</text>
    </g>

    <!-- batang horizontal -->
    <rect x="390" y="128" width="370" height="330" rx="22" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="414" y="166" fill="#ffffff" font-size="16" font-weight="700">Sumber belajar favorit</text>
    <g font-size="13" fill="#e0e7ff">
      <text x="414" y="204">YouTube</text>
      <rect x="414" y="212" width="320" height="14" rx="7" fill="#ffffff" fill-opacity=".12"/>
      <rect x="414" y="212" width="272" height="14" rx="7" fill="url(#p5-bar)"/>
      <text x="734" y="204" text-anchor="end" font-weight="700">85%</text>

      <text x="414" y="256">Dokumentasi resmi</text>
      <rect x="414" y="264" width="320" height="14" rx="7" fill="#ffffff" fill-opacity=".12"/>
      <rect x="414" y="264" width="198" height="14" rx="7" fill="url(#p5-bar)"/>
      <text x="734" y="256" text-anchor="end" font-weight="700">62%</text>

      <text x="414" y="308">Teman sekelas</text>
      <rect x="414" y="316" width="320" height="14" rx="7" fill="#ffffff" fill-opacity=".12"/>
      <rect x="414" y="316" width="176" height="14" rx="7" fill="url(#p5-bar)"/>
      <text x="734" y="308" text-anchor="end" font-weight="700">55%</text>

      <text x="414" y="360">Kursus daring</text>
      <rect x="414" y="368" width="320" height="14" rx="7" fill="#ffffff" fill-opacity=".12"/>
      <rect x="414" y="368" width="122" height="14" rx="7" fill="url(#p5-bar)"/>
      <text x="734" y="360" text-anchor="end" font-weight="700">38%</text>
    </g>
    <!-- ikon orang -->
    <g fill="#c4b5fd" fill-opacity=".7">
      <circle cx="424" cy="414" r="7"/><rect x="415" y="423" width="18" height="16" rx="6"/>
      <circle cx="450" cy="414" r="7"/><rect x="441" y="423" width="18" height="16" rx="6"/>
      <circle cx="476" cy="414" r="7"/><rect x="467" y="423" width="18" height="16" rx="6"/>
    </g>
    <circle cx="502" cy="414" r="7" fill="#2dd4bf"/><rect x="493" y="423" width="18" height="16" rx="6" fill="#2dd4bf"/>
    <text x="524" y="436" fill="#e0e7ff" font-size="13">1 dari 4 belajar berkelompok</text>
  </g>
</svg>
