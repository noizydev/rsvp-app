<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="p2-title">
  <title id="p2-title">Klasifikasi Sentimen Ulasan Aplikasi</title>
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset=".55" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#86198f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#p2-bg)"/>
  <circle cx="120" cy="80" r="170" fill="#a78bfa" opacity=".2"/>
  <circle cx="720" cy="440" r="160" fill="#2dd4bf" opacity=".18"/>

  <g font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif">
    <!-- gelembung positif -->
    <rect x="50" y="70" width="330" height="96" rx="22" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".22"/>
    <path d="M90 166 l0 26 l26 -26z" fill="#ffffff" fill-opacity=".12"/>
    <circle cx="96" cy="118" r="24" fill="#2dd4bf"/>
    <path d="M86 112 h0.01 M106 112 h0.01" stroke="#134e4a" stroke-width="6" stroke-linecap="round"/>
    <path d="M85 124 q11 12 22 0" fill="none" stroke="#134e4a" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="136" y="100" width="200" height="12" rx="6" fill="#ffffff" fill-opacity=".6"/>
    <rect x="136" y="124" width="150" height="12" rx="6" fill="#ffffff" fill-opacity=".35"/>
    <text x="300" y="152" fill="#5eead4" font-size="16" font-weight="700">+0,92</text>

    <!-- gelembung negatif -->
    <rect x="110" y="226" width="330" height="96" rx="22" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".22"/>
    <path d="M400 322 l0 26 l-26 -26z" fill="#ffffff" fill-opacity=".12"/>
    <circle cx="156" cy="274" r="24" fill="#fda4af"/>
    <path d="M146 268 h0.01 M166 268 h0.01" stroke="#881337" stroke-width="6" stroke-linecap="round"/>
    <path d="M145 286 q11 -10 22 0" fill="none" stroke="#881337" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="196" y="256" width="200" height="12" rx="6" fill="#ffffff" fill-opacity=".6"/>
    <rect x="196" y="280" width="120" height="12" rx="6" fill="#ffffff" fill-opacity=".35"/>
    <text x="360" y="308" fill="#fda4af" font-size="16" font-weight="700">−0,78</text>

    <!-- gelembung netral kecil -->
    <rect x="50" y="380" width="240" height="70" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="76" y="406" width="150" height="10" rx="5" fill="#ffffff" fill-opacity=".4"/>
    <rect x="76" y="424" width="100" height="10" rx="5" fill="#ffffff" fill-opacity=".25"/>

    <!-- confusion matrix -->
    <rect x="480" y="70" width="280" height="330" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="504" y="104" fill="#f5f3ff" font-size="16" font-weight="700">Confusion Matrix</text>
    <rect x="530" y="130" width="100" height="100" rx="12" fill="#2dd4bf" fill-opacity=".85"/>
    <rect x="636" y="130" width="100" height="100" rx="12" fill="#ffffff" fill-opacity=".14"/>
    <rect x="530" y="236" width="100" height="100" rx="12" fill="#ffffff" fill-opacity=".2"/>
    <rect x="636" y="236" width="100" height="100" rx="12" fill="#a78bfa" fill-opacity=".85"/>
    <g font-size="26" font-weight="700" text-anchor="middle">
      <text x="580" y="189" fill="#042f2e">412</text>
      <text x="686" y="189" fill="#f5f3ff">38</text>
      <text x="580" y="295" fill="#f5f3ff">51</text>
      <text x="686" y="295" fill="#2e1065">399</text>
    </g>
    <g font-size="12" fill="#e9d5ff" text-anchor="middle">
      <text x="580" y="356">Pred +</text>
      <text x="686" y="356">Pred −</text>
    </g>
    <g font-size="12" fill="#e9d5ff" text-anchor="end">
      <text x="522" y="184">Aktual +</text>
      <text x="522" y="290">Aktual −</text>
    </g>
    <text x="504" y="386" fill="#5eead4" font-size="15" font-weight="700">Akurasi 90,1%</text>
  </g>
</svg>
