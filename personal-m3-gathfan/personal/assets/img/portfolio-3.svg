<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="p3-title">
  <title id="p3-title">Aplikasi RSVP Kelompok (Komputasi Awan)</title>
  <defs>
    <linearGradient id="p3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset=".5" stop-color="#3730a3"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="p3-cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#c7d2fe" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="p3-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#p3-bg)"/>
  <circle cx="650" cy="90" r="180" fill="#2dd4bf" opacity=".14"/>
  <circle cx="100" cy="430" r="150" fill="#c084fc" opacity=".2"/>

  <!-- awan + server -->
  <path d="M120 200 a60 60 0 0 1 20 -116 a80 80 0 0 1 150 -10 a56 56 0 0 1 60 70 a46 46 0 0 1 -10 56z" fill="url(#p3-cloud)"/>
  <g stroke="#a5b4fc" stroke-width="3" stroke-dasharray="6 8" fill="none">
    <path d="M150 200 V270"/>
    <path d="M240 200 V270"/>
    <path d="M330 200 V270"/>
  </g>
  <g font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif">
    <g>
      <rect x="110" y="270" width="80" height="96" rx="12" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".25"/>
      <rect x="122" y="286" width="56" height="10" rx="5" fill="#ffffff" fill-opacity=".45"/>
      <rect x="122" y="304" width="56" height="10" rx="5" fill="#ffffff" fill-opacity=".3"/>
      <circle cx="130" cy="346" r="5" fill="#5eead4"/>
      <text x="150" y="351" fill="#e0e7ff" font-size="13" font-weight="700" text-anchor="middle" dx="10">m1</text>
    </g>
    <g>
      <rect x="200" y="270" width="80" height="96" rx="12" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".25"/>
      <rect x="212" y="286" width="56" height="10" rx="5" fill="#ffffff" fill-opacity=".45"/>
      <rect x="212" y="304" width="56" height="10" rx="5" fill="#ffffff" fill-opacity=".3"/>
      <circle cx="220" cy="346" r="5" fill="#5eead4"/>
      <text x="240" y="351" fill="#e0e7ff" font-size="13" font-weight="700" text-anchor="middle" dx="10">m2</text>
    </g>
    <g>
      <rect x="290" y="270" width="80" height="96" rx="12" fill="#ffffff" fill-opacity=".2" stroke="#5eead4" stroke-width="2"/>
      <rect x="302" y="286" width="56" height="10" rx="5" fill="#ffffff" fill-opacity=".55"/>
      <rect x="302" y="304" width="56" height="10" rx="5" fill="#ffffff" fill-opacity=".35"/>
      <circle cx="310" cy="346" r="5" fill="#5eead4"/>
      <text x="330" y="351" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" dx="10">m3</text>
    </g>
    <text x="110" y="410" fill="#c7d2fe" font-size="15" font-weight="600">Satu aplikasi, beberapa server</text>

    <!-- kartu acara -->
    <rect x="440" y="70" width="320" height="360" rx="22" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".22"/>
    <rect x="440" y="70" width="320" height="64" rx="22" fill="#ffffff" fill-opacity=".1"/>
    <rect x="474" y="56" width="10" height="28" rx="5" fill="#e0e7ff"/>
    <rect x="716" y="56" width="10" height="28" rx="5" fill="#e0e7ff"/>
    <text x="466" y="112" fill="#ffffff" font-size="20" font-weight="700">Acara Kelompok</text>

    <text x="466" y="170" fill="#e0e7ff" font-size="14" font-weight="600">Seminar Cloud</text>
    <rect x="466" y="182" width="268" height="12" rx="6" fill="#ffffff" fill-opacity=".14"/>
    <rect x="466" y="182" width="190" height="12" rx="6" fill="url(#p3-fill)"/>

    <text x="466" y="236" fill="#e0e7ff" font-size="14" font-weight="600">Workshop Docker</text>
    <rect x="466" y="248" width="268" height="12" rx="6" fill="#ffffff" fill-opacity=".14"/>
    <rect x="466" y="248" width="120" height="12" rx="6" fill="url(#p3-fill)"/>

    <text x="466" y="302" fill="#e0e7ff" font-size="14" font-weight="600">Sharing Session</text>
    <rect x="466" y="314" width="268" height="12" rx="6" fill="#ffffff" fill-opacity=".14"/>
    <rect x="466" y="314" width="240" height="12" rx="6" fill="url(#p3-fill)"/>

    <rect x="466" y="360" width="140" height="44" rx="22" fill="url(#p3-fill)"/>
    <text x="536" y="388" fill="#1e1b4b" font-size="15" font-weight="700" text-anchor="middle">Daftar</text>
    <circle cx="710" cy="382" r="24" fill="#2dd4bf"/>
    <path d="M699 382 l8 8 l15 -16" fill="none" stroke="#134e4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
