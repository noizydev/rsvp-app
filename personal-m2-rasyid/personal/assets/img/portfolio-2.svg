  <g transform="translate(330 70) rotate(10)">
    <rect x="-52" y="-18" width="104" height="36" rx="18" fill="#7BE0AD" stroke="#111" stroke-width="4"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Archivo Black','Arial Black',Arial,sans-serif" font-weight="900" font-size="15" fill="#111">PRE-ORDER</text>
  </g>
  <!-- notifikasi -->
  <g transform="translate(332 176) rotate(-6)">
    <rect x="-46" y="-26" width="92" height="52" rx="10" fill="#111"/>
    <rect x="-50" y="-30" width="92" height="52" rx="10" fill="#4CC9F0" stroke="#111" stroke-width="4"/>
    <path d="M-30 -4 l8 8 l16 -18" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="2" y="-10" width="30" height="7" rx="3.5" fill="#111"/>
    <rect x="2" y="2" width="20" height="7" rx="3.5" fill="#111"/>
