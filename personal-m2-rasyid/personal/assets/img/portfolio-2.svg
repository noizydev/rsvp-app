<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-labelledby="p2t">
  <title id="p2t">Ilustrasi aplikasi mobile KantinKu</title>
  <defs>
    <pattern id="p2stripe" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="20" fill="#111" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="400" height="260" fill="#FF6B6B"/>
  <rect width="400" height="260" fill="url(#p2stripe)"/>
  <!-- mangkuk -->
  <g transform="translate(78 150) rotate(-8)">
    <path d="M-30 -14 q30 -26 60 0" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <path d="M-12 -24 q4 -10 0 -18 M2 -26 q4 -10 0 -18" fill="none" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-46 -10 h92 a46 40 0 0 1 -92 0 Z" fill="#FFD23F" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-56" y="-16" width="112" height="12" rx="6" fill="#FFFDF7" stroke="#111" stroke-width="4"/>
  </g>
  <!-- ponsel -->
  <rect x="160" y="24" width="124" height="226" rx="20" fill="#111"/>
  <rect x="152" y="16" width="124" height="226" rx="20" fill="#FFFDF7" stroke="#111" stroke-width="5"/>
  <rect x="196" y="24" width="36" height="8" rx="4" fill="#111"/>
  <rect x="164" y="40" width="100" height="34" rx="8" fill="#FFD23F" stroke="#111" stroke-width="3.5"/>
  <rect x="174" y="51" width="56" height="10" rx="5" fill="#111"/>
  <g stroke="#111" stroke-width="3.5">
    <rect x="164" y="84" width="100" height="38" rx="8" fill="#FFFFFF"/>
    <rect x="164" y="130" width="100" height="38" rx="8" fill="#FFFFFF"/>
    <rect x="164" y="176" width="100" height="38" rx="8" fill="#FFFFFF"/>
    <circle cx="183" cy="103" r="10" fill="#7BE0AD"/>
    <circle cx="183" cy="149" r="10" fill="#4CC9F0"/>
    <circle cx="183" cy="195" r="10" fill="#B8A4FF"/>
  </g>
  <g fill="#111" opacity=".7">
    <rect x="200" y="96" width="50" height="6" rx="3"/><rect x="200" y="106" width="32" height="6" rx="3"/>
    <rect x="200" y="142" width="44" height="6" rx="3"/><rect x="200" y="152" width="28" height="6" rx="3"/>
    <rect x="200" y="188" width="54" height="6" rx="3"/><rect x="200" y="198" width="30" height="6" rx="3"/>
  </g>
  <rect x="186" y="222" width="56" height="10" rx="5" fill="#111" opacity=".25"/>
