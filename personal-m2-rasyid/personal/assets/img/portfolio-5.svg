<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-labelledby="p5t">
  <title id="p5t">Ilustrasi microsite acara Pekan Informatika</title>
  <defs>
    <pattern id="p5dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#111" opacity=".15"/>
    </pattern>
  </defs>
  <rect width="400" height="260" fill="#7BE0AD"/>
  <rect width="400" height="260" fill="url(#p5dots)"/>
  <!-- poster -->
  <g transform="rotate(-4 150 130)">
    <rect x="70" y="30" width="160" height="204" rx="6" fill="#111" transform="translate(7 7)"/>
    <rect x="70" y="30" width="160" height="204" rx="6" fill="#FFFDF7" stroke="#111" stroke-width="5"/>
    <rect x="70" y="30" width="160" height="70" rx="6" fill="#B8A4FF" stroke="#111" stroke-width="5"/>
    <text x="150" y="62" text-anchor="middle" font-family="'Archivo Black','Arial Black',Arial,sans-serif" font-weight="900" font-size="22" fill="#111">PEKAN</text>
    <text x="150" y="88" text-anchor="middle" font-family="'Archivo Black','Arial Black',Arial,sans-serif" font-weight="900" font-size="22" fill="#111">IF 2025</text>
    <g fill="#111" opacity=".75">
      <rect x="86" y="114" width="96" height="8" rx="4"/>
      <rect x="86" y="130" width="120" height="8" rx="4"/>
      <rect x="86" y="146" width="70" height="8" rx="4"/>
    </g>
    <rect x="86" y="172" width="80" height="30" rx="8" fill="#FF6B6B" stroke="#111" stroke-width="4"/>
    <rect x="98" y="183" width="56" height="8" rx="4" fill="#111"/>
    <!-- selotip -->
    <rect x="124" y="20" width="52" height="18" fill="#FFD23F" fill-opacity=".9" stroke="#111" stroke-width="2.5" transform="rotate(6 150 29)"/>
  </g>
  <!-- megafon -->
  <g transform="translate(300 96) rotate(-18)">
    <path d="M-40 -12 L20 -38 L20 38 L-40 12 Z" fill="#FFD23F" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-58" y="-14" width="20" height="28" rx="4" fill="#FF6B6B" stroke="#111" stroke-width="5"/>
    <ellipse cx="20" cy="0" rx="9" ry="38" fill="#FFFDF7" stroke="#111" stroke-width="5"/>
    <path d="M-30 12 L-24 34 L-12 32 L-16 8" fill="#4CC9F0" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    <path d="M42 -26 l14 -10 M46 0 h18 M42 26 l14 10" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- tiket -->
  <g transform="translate(310 196) rotate(8)">
    <path d="M-56 -24 h112 v14 a10 10 0 0 0 0 20 v14 h-112 v-14 a10 10 0 0 0 0 -20 Z" fill="#4CC9F0" stroke="#111" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M22 -20 v40" stroke="#111" stroke-width="3" stroke-dasharray="5 5"/>
    <text x="-16" y="7" text-anchor="middle" font-family="'Archivo Black','Arial Black',Arial,sans-serif" font-weight="900" font-size="17" fill="#111">TIKET</text>
    <circle cx="39" cy="0" r="6" fill="#111"/>
  </g>
